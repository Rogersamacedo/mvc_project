{% extends "base.html" %}
{% block content %}

<div class="page-center">
  <section class="card card-form card-edit">
    <div class="card-header">
      <span class="layer-badge controller">Controller</span>
      <h2>Editar Aluno #{{ aluno.id }}</h2>
    </div>
    <form action="/alterar/{{ aluno.id }}" method="post">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" value="{{ aluno.nome }}" required/>
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ aluno.email }}" required/>
      </div>
      <div class="form-group">
        <label for="curso">Curso</label>
        <input type="text" id="curso" name="curso" value="{{ aluno.curso }}" required/>
      </div>
      <div class="btn-row">
        <a href="/" class="btn btn-cancel">← Cancelar</a>
        <button type="submit" class="btn btn-primary">💾 Salvar</button>
      </div>
    </form>
  </section>
</div>

{% endblock %}
